name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      SUPABASE_URL: "https://fake-project.supabase.co"
      SUPABASE_ANON_KEY: "fake-anon-key"
      SUPABASE_SECRET_KEY: "fake-service-role-key"
      SECRET_KEY: "dummy-secret-key-for-ci-testing-purposes-only"
      ENVIRONMENT: "test"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest test suite
        run: python -m pytest backend/tests -v -o pythonpath=backend

  frontend-check:
    name: Frontend Syntax & Asset Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          for file in frontend/*.js; do
            echo "Checking syntax: $file"
            node --check "$file"
          done

      - name: Verify critical static assets exist
        run: |
          test -f frontend/index.html || { echo "Missing frontend/index.html"; exit 1; }
          test -f frontend/aiia-logo.jpg || { echo "Missing frontend/aiia-logo.jpg"; exit 1; }
          echo "Frontend assets verified."

  security-scan:
    name: Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run Dependency Vulnerability Audit (pip-audit)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt

  deploy:
    name: Deploy to Production
    needs: [backend-tests, frontend-check, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Backend Deploy Hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render deployment..."
            curl -s -S -X POST "$DEPLOY_HOOK_URL"
            echo "Deploy hook sent successfully."
          else
            echo "::notice ::RENDER_DEPLOY_HOOK_URL secret not configured. Skipping deploy hook trigger (Vercel deploys frontend automatically from Git)."
          fi
